<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김채영 명세서 · Frontend Developer</title>
    <meta name="description" content="김채영이라는 제품을 스캔하여 정보를 조회하는 인터랙티브 포트폴리오" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 링크 공유 시 미리보기 카드(카카오톡/슬랙/트위터 등)에 쓰이는 정보 —
         도메인이 확정되면 og:url과 og:image를 절대경로로 바꿔주는 게 안전하다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="김채영 명세서 · Frontend Developer" />
    <meta
      property="og:description"
      content="김채영이라는 제품을 스캔하여 정보를 조회하는 인터랙티브 포트폴리오"
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="김채영 명세서 · Frontend Developer" />
    <meta
      name="twitter:description"
      content="김채영이라는 제품을 스캔하여 정보를 조회하는 인터랙티브 포트폴리오"
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- 개발 서버(vite dev)는 CSS를 JS로 주입해서, 외부 스타일시트가 적용되기 전
         잠깐(~150ms) BEEP 말풍선·스캔 라인이 숨김 처리 없이 그대로 보이는 순간이
         있었다. 본 스타일시트를 기다릴 필요 없이 첫 페인트부터 바로 숨겨지도록
         핵심 규칙만 인라인으로 먼저 넣어둔다(프로덕션 빌드는 스타일시트가
         렌더 블로킹이라 원래도 문제없지만, 값이 같아서 나중에 그대로 이어받는다) -->
    <style>
      #beep-bubble {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
      }
      #scan-line {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      // 404.html이 남겨둔 원래 경로가 있으면(정적 호스팅에서 딥링크로 직접
      // 들어온 경우) 라우터가 읽기 전에 주소를 먼저 복원해둔다
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <section id="hero" class="hero">
        <div id="hero-canvas" class="hero__canvas"></div>
        <p id="hero-hint" class="hero__hint">바코드를 스캔해보세요</p>
        <button type="button" id="hero-explore-btn" class="hero__explore-btn">
          제품 둘러보기
        </button>
        <div id="scan-line" class="scan-line"></div>
        <div id="beep-bubble" class="beep-bubble">
          <svg class="beep-bubble__svg" viewBox="-6 -6 112 112" aria-hidden="true">
            <polygon
              class="beep-bubble__shape"
              points="50,0 61,24 88,8 76,34 100,50 76,66 88,92 61,76 50,100 39,76 12,92 24,66 0,50 24,34 12,8 39,24"
            />
          </svg>
          <span class="beep-bubble__text">BEEP</span>
        </div>
      </section>
      <section id="pos" class="pos-screen" hidden>
        <div class="checkout-track" id="checkout-track">
          <div class="checkout-stage__panel checkout-stage__panel--pos" id="panel-pos">
            <div class="pos-frame">
              <div class="pos">
                <div class="pos__glass" aria-hidden="true"></div>

                <div class="pos__header">
                  <div class="pos__header-status">
                    <button type="button" class="pos__header-back" id="pos-back" aria-label="처음 화면으로">←</button>
                    <span class="pos__header-icon" id="pos-wifi-icon" aria-hidden="true"></span>
                    <span class="pos__header-label" aria-hidden="true">TERMINAL · NO.313</span>
                  </div>
                  <div class="pos__header-clock" id="pos-clock" aria-hidden="true">00:00:00</div>
                  <div class="pos__header-status pos__header-status--right" aria-hidden="true">
                    <span class="pos__header-battery">100%</span>
                    <span class="pos__header-icon" id="pos-battery-icon"></span>
                  </div>
                </div>

                <div class="pos__main">
                  <div class="pos__content">
                    <nav class="pos-tabs" id="pos-menu" aria-label="POS 메뉴"></nav>
                    <div class="pos__preview">
                      <div class="pos__preview-inner" id="pos-preview-inner"></div>
                    </div>
                  </div>

                  <div class="pos-cart">
                    <div class="pos-cart__list" id="pos-cart-list"></div>

                    <div class="pos-summary">
                      <p class="pos-summary__eyebrow">ORDER SUMMARY</p>
                      <div class="pos-summary__rows">
                        <div class="pos-summary__row">
                          <span>Experience</span>
                          <span id="pos-summary-exp"></span>
                        </div>
                        <div class="pos-summary__row">
                          <span>Status</span>
                          <span id="pos-summary-status"></span>
                        </div>
                      </div>
                      <div class="pos-summary__total">
                        <span>TOTAL</span>
                        <span id="pos-summary-code"></span>
                      </div>
                      <button type="button" class="pos-btn pos-btn--primary pos-summary__order" id="pos-order">
                        ORDER
                      </button>
                    </div>
                  </div>
                </div>

                <div class="detail-modal-backdrop" id="project-modal">
                  <div class="detail-modal" role="dialog" aria-modal="true">
                    <div class="detail-modal__header">
                      <p class="detail-modal__header-title" id="project-modal-title"></p>
                      <button type="button" class="detail-modal__close" id="project-modal-close" aria-label="닫기">✕</button>
                    </div>
                    <div class="detail-modal__body" id="project-modal-body"></div>
                    <div class="project-modal__footer">
                      <button type="button" class="pos-btn pos-btn--primary project-modal__select" id="project-modal-select">
                        SELECT
                      </button>
                    </div>
                  </div>
                </div>

                <div class="detail-modal-backdrop" id="about-modal">
                  <div class="detail-modal" role="dialog" aria-modal="true">
                    <div class="detail-modal__header">
                      <p class="detail-modal__header-title" id="about-modal-title"></p>
                      <button type="button" class="detail-modal__close" id="about-modal-close" aria-label="닫기">✕</button>
                    </div>
                    <div class="detail-modal__body" id="about-modal-body"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="checkout-stage__panel checkout-stage__panel--receipt" id="panel-receipt">
            <div class="receipt-scene">
              <div class="receipt-scene__header">
                <span class="receipt-scene__label">RECEIPT PRINTER</span>
                <button type="button" class="receipt-scene__back" id="receipt-close">
                  ← BACK TO POS
                </button>
              </div>
              <div class="receipt-scene__stack">
                <div class="receipt-printer" aria-hidden="true">
                  <div class="receipt-printer__slot"></div>
                </div>
                <div class="receipt-outlet" id="receipt-outlet">
                  <div class="receipt" id="receipt-paper"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
